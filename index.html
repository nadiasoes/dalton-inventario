<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#CC0000">
<title>Inventario de Herramientas — Dalton Mantenimiento</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#fff;--bg2:#f5f5f5;--bg3:#ebebeb;--border:rgba(0,0,0,0.09);--border2:rgba(0,0,0,0.16);--text:#1a1a1a;--text2:#5a5a5a;--text3:#999;--dalton:#CC0000;--dalton2:rgba(204,0,0,0.07);--dalton3:rgba(204,0,0,0.18);--green:#1a8a52;--green2:rgba(26,138,82,0.1);--red:#CC0000;--red2:rgba(204,0,0,0.08);--amber:#b06000;--amber2:rgba(176,96,0,0.1);--blue:#1a5fa8;--blue2:rgba(26,95,168,0.1);--radius:12px;--radius-sm:8px;--nav-h:64px;--bottom-h:72px;--font:'DM Sans',system-ui,sans-serif;--mono:'DM Mono',monospace;}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
html{font-size:16px;-webkit-text-size-adjust:100%;}
body{font-family:var(--font);background:var(--bg);color:var(--text);min-height:100dvh;overflow-x:hidden;}
.app{display:flex;flex-direction:column;min-height:100dvh;}
.topbar{position:sticky;top:0;z-index:50;background:#CC0000;border-bottom:2px solid #a80000;padding:0 16px;height:var(--nav-h);display:flex;align-items:center;justify-content:space-between;box-shadow:0 2px 12px rgba(204,0,0,0.3);}
.topbar-brand{display:flex;align-items:center;gap:12px;}
.topbar-logo-wrap{background:#fff;border-radius:8px;padding:3px 7px;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.topbar-title{font-size:15px;font-weight:600;color:#fff;letter-spacing:-0.2px;line-height:1.25;}
.topbar-sub{font-size:11px;color:rgba(255,255,255,0.72);margin-top:1px;}
.desktop-nav{display:none;}
.content{flex:1;padding:16px 16px calc(var(--bottom-h) + 16px);max-width:960px;width:100%;margin:0 auto;}
.bottom-nav{position:fixed;bottom:0;left:0;right:0;z-index:50;background:rgba(255,255,255,0.97);backdrop-filter:blur(12px);border-top:1px solid var(--border);display:flex;height:var(--bottom-h);padding-bottom:env(safe-area-inset-bottom);}
.nav-item{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:6px 0;cursor:pointer;border:none;background:transparent;color:var(--text3);font-family:var(--font);font-size:9px;font-weight:500;transition:color 0.15s;-webkit-tap-highlight-color:transparent;position:relative;}
.nav-item.active{color:var(--dalton);}
.nav-item svg{width:20px;height:20px;}
.nav-dot{position:absolute;top:6px;right:calc(50% - 16px);width:6px;height:6px;border-radius:50%;background:var(--dalton);display:none;}
.page{display:none;}.page.active{display:block;}
.kpi-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:20px;}
.kpi-card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius);padding:14px 16px;}
.kpi-card.highlight{background:var(--dalton2);border-color:rgba(204,0,0,0.2);}.kpi-card.highlight .kpi-val{color:var(--dalton);}
.kpi-card.danger{border-color:rgba(204,0,0,0.3);background:rgba(204,0,0,0.05);}.kpi-card.danger .kpi-val{color:var(--dalton);}
.kpi-icon{font-size:20px;margin-bottom:8px;}.kpi-val{font-size:28px;font-weight:700;letter-spacing:-1px;line-height:1;}.kpi-label{font-size:12px;color:var(--text2);margin-top:4px;}
.section{margin-bottom:24px;}
.section-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;flex-wrap:wrap;gap:8px;}
.section-title{font-size:13px;font-weight:600;color:var(--text3);text-transform:uppercase;letter-spacing:0.07em;}
.card-list{display:flex;flex-direction:column;gap:8px;}
.tool-card{background:var(--bg);border:1px solid var(--border);border-radius:var(--radius);padding:14px 16px;display:flex;align-items:center;gap:12px;cursor:pointer;transition:border-color 0.15s,box-shadow 0.15s;-webkit-tap-highlight-color:transparent;}
.tool-card:hover{border-color:var(--border2);box-shadow:0 2px 8px rgba(0,0,0,0.06);}
.tool-card:active{background:var(--bg2);}
.tool-card.warn{border-left:3px solid var(--amber);}.tool-card.danger{border-left:3px solid var(--dalton);}
.tool-icon{width:42px;height:42px;border-radius:10px;background:var(--bg2);border:1px solid var(--border);flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:19px;}
.tool-info{flex:1;min-width:0;}.tool-name{font-size:15px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}.tool-meta{font-size:12px;color:var(--text2);margin-top:2px;}
.tool-right{text-align:right;flex-shrink:0;}.tool-qty{font-size:22px;font-weight:700;font-family:var(--mono);}.tool-qty-label{font-size:11px;color:var(--text3);}
.badge{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:600;padding:3px 9px;border-radius:20px;}
.badge-ok{background:rgba(26,138,82,0.1);color:#1a8a52;}.badge-warn{background:rgba(176,96,0,0.1);color:#b06000;}.badge-danger{background:rgba(204,0,0,0.09);color:#CC0000;}
.ag-list,.cat-list,.st-list{display:flex;flex-direction:column;gap:8px;}
.ag-row,.cat-row,.st-row{background:var(--bg);border:1px solid var(--border);border-radius:var(--radius);padding:14px 16px;display:flex;align-items:center;gap:12px;}
.ag-row:hover,.st-row:hover{box-shadow:0 2px 8px rgba(0,0,0,0.07);}
.ag-avatar{width:42px;height:42px;border-radius:50%;background:var(--dalton);flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700;color:#fff;font-family:var(--mono);}
.ag-info{flex:1;min-width:0;cursor:pointer;}.ag-name,.cat-name,.st-name{font-size:15px;font-weight:500;}.ag-resp-line{font-size:12px;color:var(--text2);margin-top:2px;}.ag-stats-line{font-size:11px;color:var(--text3);margin-top:3px;display:flex;align-items:center;flex-wrap:wrap;gap:6px;}
.ag-actions{display:flex;gap:6px;flex-shrink:0;}
.st-dot{width:14px;height:14px;border-radius:50%;flex-shrink:0;}
.st-info{flex:1;min-width:0;}.st-count,.cat-count{font-size:12px;color:var(--text2);margin-top:2px;}
.st-badge-wrap{flex-shrink:0;}
.cat-icon-box{width:40px;height:40px;border-radius:10px;background:var(--dalton2);border:1px solid var(--dalton3);flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:19px;}
.cat-info{flex:1;min-width:0;}.cat-actions{display:flex;gap:6px;flex-shrink:0;}
.btn-icon-sm{display:inline-flex;align-items:center;justify-content:center;width:32px;height:32px;border-radius:8px;border:1px solid var(--border);background:var(--bg2);color:var(--text2);cursor:pointer;font-size:14px;-webkit-tap-highlight-color:transparent;}
.btn-icon-sm:active{transform:scale(0.95);}.btn-icon-sm.red{color:var(--dalton);border-color:rgba(204,0,0,0.2);background:var(--red2);}
.filter-bar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px;}
.filter-bar input,.filter-bar select{font-family:var(--font);font-size:13px;height:38px;padding:0 12px;background:var(--bg);border:1px solid var(--border);border-radius:var(--radius-sm);color:var(--text);outline:none;}
.filter-bar input{flex:1;min-width:140px;}.filter-bar input::placeholder{color:var(--text3);}.filter-bar select{min-width:120px;}
.filter-bar input:focus,.filter-bar select:focus{border-color:var(--dalton);}
.btn{display:inline-flex;align-items:center;gap:7px;padding:9px 16px;font-size:14px;font-weight:500;font-family:var(--font);border-radius:var(--radius-sm);border:1px solid var(--border2);background:var(--bg);color:var(--text);cursor:pointer;white-space:nowrap;-webkit-tap-highlight-color:transparent;transition:all 0.15s;}
.btn:hover{background:var(--bg2);}.btn:active{transform:scale(0.97);}
.btn-accent{background:var(--dalton);color:#fff;border-color:var(--dalton);font-weight:600;}.btn-accent:hover{background:#a80000;}.btn-accent:active{opacity:0.88;}
.btn-sm{padding:6px 12px;font-size:13px;}.btn-danger{border-color:rgba(204,0,0,0.3);color:var(--dalton);background:var(--red2);}
.fab{position:fixed;bottom:calc(var(--bottom-h) + 14px);right:16px;z-index:40;width:54px;height:54px;border-radius:50%;background:var(--dalton);color:#fff;border:none;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 18px rgba(204,0,0,0.45);cursor:pointer;font-size:28px;line-height:1;-webkit-tap-highlight-color:transparent;}
.fab:active{transform:scale(0.93);}
.modal-overlay{display:none;position:fixed;inset:0;z-index:100;background:rgba(0,0,0,0.4);align-items:flex-end;justify-content:center;}
.modal-overlay.open{display:flex;}
.modal-sheet{background:var(--bg);border:1px solid var(--border2);border-radius:20px 20px 0 0;padding:20px 20px calc(20px + env(safe-area-inset-bottom));width:100%;max-height:92dvh;overflow-y:auto;}
.modal-handle{width:36px;height:4px;border-radius:2px;background:var(--border2);margin:0 auto 16px;}
.modal-title{font-size:17px;font-weight:600;margin-bottom:18px;}
.form-group{margin-bottom:14px;}.form-label{font-size:12px;color:var(--text2);font-weight:600;margin-bottom:6px;display:block;text-transform:uppercase;letter-spacing:0.04em;}
.form-input{width:100%;font-family:var(--font);font-size:15px;padding:11px 14px;background:var(--bg2);color:var(--text);border:1px solid var(--border);border-radius:var(--radius-sm);outline:none;}
.form-input:focus{border-color:var(--dalton);}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.modal-footer{display:flex;gap:10px;margin-top:20px;}.modal-footer .btn{flex:1;justify-content:center;}
.stat-row{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:18px;}
.stat-box{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius-sm);padding:12px;text-align:center;}
.stat-val{font-size:24px;font-weight:700;font-family:var(--mono);}.stat-lbl{font-size:11px;color:var(--text3);margin-top:3px;}
.detail-actions{display:flex;gap:8px;flex-wrap:wrap;}
.contact-box{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius-sm);padding:14px;margin-bottom:16px;display:flex;flex-direction:column;gap:8px;}
.contact-line{font-size:13px;color:var(--text2);}
.empty{text-align:center;padding:48px 20px;color:var(--text3);}.empty-icon{font-size:44px;margin-bottom:12px;}.empty-text{font-size:14px;}
.divider{height:1px;background:var(--border);margin:6px 0 14px;}
.chip-grid{display:flex;flex-wrap:wrap;gap:8px;margin-top:4px;}
.chip{padding:6px 12px;border-radius:20px;border:1.5px solid var(--border);background:var(--bg2);cursor:pointer;font-size:20px;line-height:1;}
.chip.selected{border-color:var(--dalton);background:var(--dalton2);}
.color-grid{display:flex;flex-wrap:wrap;gap:10px;margin-top:6px;}
.color-chip{width:32px;height:32px;border-radius:50%;cursor:pointer;border:3px solid transparent;}
.color-chip.selected{border-color:var(--text);}
.qty-btn{width:36px;height:36px;border-radius:50%;border:1.5px solid var(--border2);background:var(--bg);color:var(--text);font-size:20px;line-height:1;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-weight:300;}
.qty-btn:active{background:var(--bg2);}
.global-loader{position:fixed;inset:0;z-index:200;background:rgba(255,255,255,0.95);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;}
.loader-spinner{width:40px;height:40px;border:3px solid var(--dalton2);border-top-color:var(--dalton);border-radius:50%;animation:spin 0.8s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}
.loader-text{font-size:14px;color:var(--text2);}
@media(min-width:900px){
  .bottom-nav{display:none;}.content{padding:24px 32px 32px;}.fab{bottom:32px;}.topbar{padding:0 32px;}.kpi-grid{grid-template-columns:repeat(4,1fr);}
  .desktop-nav{display:flex !important;gap:4px;}
  .desktop-nav button{padding:7px 14px;font-size:12px;font-weight:500;border-radius:6px;border:none;background:rgba(255,255,255,0.15);color:rgba(255,255,255,0.85);cursor:pointer;font-family:var(--font);white-space:nowrap;}
  .desktop-nav button:hover{background:rgba(255,255,255,0.25);}
  .desktop-nav button.active{background:#fff;color:#CC0000;font-weight:600;}
  .modal-sheet{border-radius:var(--radius) !important;max-width:480px;}.modal-overlay{align-items:center;}
}
</style>
</head>

<script>
var API = "https://script.google.com/macros/s/AKfycbym-pZPJw6nO8QHPEF897w6huGAbamj7cg-STJtaQLmfpW8hOt_mKRT7Yss-bsgkBhH/exec";

var CAT_ICONS = ["\u{1F527}","\u{1F528}","\u26A1","\u{1F4CF}","\u{1FAA3}","\u{1F6BF}","\u26D1","\u{1FAA5}","\u{1F529}","\u{1FA9B}","\u{1F50C}","\u{1F9F0}","\u26D3","\u{1F6E0}","\u2699","\u{1F9F2}","\u{1F517}","\u{1F526}"];
var COLOR_PRESETS = ["#1a8a52","#b06000","#CC0000","#1a5fa8","#7b2d8b","#666666","#c47c00","#006b6b","#333333","#d44000"];

var statuses=[],categories=[],agencies=[],tools=[];
var nextStatusId=1,nextCatId=1,nextToolId=1,nextAgencyId=1;
var editingStatusId=null,editingCatId=null,editingAgencyId=null,selectedCatIcon="\u{1F527}";
var loading=false;

/* ── API ─────────────────────────────────── */
function apiGet(sheet,cb){
  fetch(API+"?sheet="+sheet)
    .then(function(r){return r.json();})
    .then(function(d){
      if(d.ok) cb(null,d.data);
      else cb(d.error||"Error",null);
    })
    .catch(function(e){cb(e.message,null);});
}
function apiPost(action,sheet,row,cb){
  fetch(API,{
    method:"POST",
    body:JSON.stringify({action:action,sheet:sheet,row:row})
  })
  .then(function(r){return r.json();})
  .then(function(d){
    if(d.ok) cb(null,d);
    else cb(d.error||"Error",null);
  })
  .catch(function(e){cb(e.message,null);});
}

/* ── LOAD ALL ────────────────────────────── */
function loadAll(cb){
  showLoader(true);
  var done=0, total=4, err=null;
  function check(){done++;if(done===total){showLoader(false);if(cb)cb(err);}}
  apiGet("statuses",function(e,d){
    if(!e&&d){statuses=d.map(toNum(["id"]));nextStatusId=maxId(statuses)+1;}
    else err=e; check();
  });
  apiGet("categories",function(e,d){
    if(!e&&d){categories=d.map(toNum(["id"]));nextCatId=maxId(categories)+1;}
    else err=e; check();
  });
  apiGet("agencies",function(e,d){
    if(!e&&d){agencies=d.map(toNum(["id"]));nextAgencyId=maxId(agencies)+1;}
    else err=e; check();
  });
  apiGet("tools",function(e,d){
    if(!e&&d){tools=d.map(toNum(["id","catId","agencyId","statusId"]));nextToolId=maxId(tools)+1;}
    else err=e; check();
  });
}
function toNum(fields){
  return function(obj){
    fields.forEach(function(f){if(obj[f]!==undefined&&obj[f]!=="")obj[f]=Number(obj[f]);});
    return obj;
  };
}
function roundQty(v){return Math.round(v*100)/100;}
function maxId(arr){
  if(!arr||!arr.length)return 0;
  return Math.max.apply(null,arr.map(function(x){return x.id||0;}));
}
function showLoader(on){
  var el=document.getElementById("globalLoader");
  if(el)el.style.display=on?"flex":"none";
}

/* ── HELPERS ─────────────────────────────── */
function stById(id){for(var i=0;i<statuses.length;i++){if(statuses[i].id===id)return statuses[i];}return null;}
function catById(id){for(var i=0;i<categories.length;i++){if(categories[i].id===id)return categories[i];}return null;}
function agById(id){for(var i=0;i<agencies.length;i++){if(agencies[i].id===id)return agencies[i];}return null;}
function agName(id){var a=agById(id);return a?a.name:"Agencia desconocida";}
function catName(id){var c=catById(id);return c?c.name:"Sin categoria";}
function catIcon(id){var c=catById(id);return c?c.icon:"\u{1F527}";}
function stName(id){var s=stById(id);return s?s.name:"Sin estado";}
function stColor(id){var s=stById(id);return s?s.color:"#999";}
function parseQty(v){
  if(v===undefined||v===null||v==="")return 0;
  var s=String(v).trim();
  // try fraction like 1/2 or 1 1/2
  var mixed=/^(\d+)\s+(\d+)\/(\d+)$/.exec(s);
  if(mixed)return parseInt(mixed[1])+(parseInt(mixed[2])/parseInt(mixed[3]));
  var frac=/^(\d+)\/(\d+)$/.exec(s);
  if(frac)return parseInt(frac[1])/parseInt(frac[2]);
  var n=parseFloat(s.replace(",","."));
  return isNaN(n)?0:n;
}
function stockOf(t){var a=parseQty(t.total)-parseQty(t.used);var m=parseQty(t.min);return a<=0?"out":a<=m?"low":"ok";}
function initials(s){return s.split(" ").slice(0,2).map(function(w){return w[0]||"";}).join("").toUpperCase()||"?";}
function esc(s){return String(s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");}
function stockBadge(s){
  if(s==="ok") return "<span class='badge badge-ok'>Disponible</span>";
  if(s==="low") return "<span class='badge badge-warn'>Stock bajo</span>";
  return "<span class='badge badge-danger'>Sin stock</span>";
}
function statusBadge(id){
  var s=stById(id);if(!s)return"";
  return "<span class='badge' style='background:"+s.color+"22;color:"+s.color+";border:1px solid "+s.color+"44'>"+esc(s.name)+"</span>";
}

/* ── KPIs ────────────────────────────────── */
function renderKPIs(){
  var total=0,used=0,alerts=0;
  for(var i=0;i<tools.length;i++){total+=tools[i].total;used+=tools[i].used;if(stockOf(tools[i])!=="ok")alerts++;}
  var pct=total>0?Math.round(used/total*100):0;
  document.getElementById("kpiGrid").innerHTML=
    "<div class='kpi-card highlight'><div class='kpi-icon'>\u{1F527}</div><div class='kpi-val'>"+total+"</div><div class='kpi-label'>Unidades totales</div></div>"+
    "<div class='kpi-card'><div class='kpi-icon'>\u{1F477}</div><div class='kpi-val'>"+used+"</div><div class='kpi-label'>En uso ("+pct+"%)</div></div>"+
    "<div class='kpi-card'><div class='kpi-icon'>\u{1F3EA}</div><div class='kpi-val'>"+agencies.length+"</div><div class='kpi-label'>Agencias activas</div></div>"+
    "<div class='kpi-card "+(alerts>0?"danger":"")+"'><div class='kpi-icon'>\u26A0</div><div class='kpi-val'>"+alerts+"</div><div class='kpi-label'>Alertas de stock</div></div>";
  var dot=document.getElementById("dashDot");if(dot)dot.style.display=alerts>0?"block":"none";
}

/* ── TOOL CARD ───────────────────────────── */
function toolCardHtml(t){
  var s=stockOf(t),tidx=tools.indexOf(t);
  var availNum=parseQty(t.total)-parseQty(t.used);
  var availDisp=availNum%1===0?availNum:availNum.toFixed(2);
  var cls=s==="low"?"warn":s==="out"?"danger":"";
  var qc=s==="out"?"var(--dalton)":s==="low"?"var(--amber)":"var(--green)";
  return "<div class='tool-card "+cls+"' onclick='openDetail("+tidx+")'>"+
    "<div class='tool-icon'>"+catIcon(t.catId)+"</div>"+
    "<div class='tool-info'><div class='tool-name'>"+esc(t.name)+"</div>"+
    "<div class='tool-meta'>"+esc(catName(t.catId))+" &middot; "+esc(agName(t.agencyId))+"</div>"+
    "<div style='margin-top:5px;display:flex;gap:5px;flex-wrap:wrap'>"+stockBadge(s)+statusBadge(t.statusId)+"</div></div>"+
    "<div class='tool-right'><div class='tool-qty' style='color:"+qc+"'>"+availDisp+"</div><div class='tool-qty-label'>disponibles</div></div></div>";
}

/* ── DASHBOARD ───────────────────────────── */
function renderDashboard(){
  var alerts=tools.filter(function(t){return stockOf(t)!=="ok";});
  document.getElementById("alertsList").innerHTML=alerts.length?alerts.map(toolCardHtml).join(""):"<div class='empty'><div class='empty-icon'>\u2705</div><div class='empty-text'>Sin alertas de stock</div></div>";
}

/* ── INVENTORY ───────────────────────────── */
function renderInventory(){
  var q=(document.getElementById("searchQ")||{value:""}).value.toLowerCase();
  var ag=parseInt((document.getElementById("fAgency")||{value:""}).value)||null;
  var cat=parseInt((document.getElementById("fCat")||{value:""}).value)||null;
  var st=parseInt((document.getElementById("fStatus")||{value:""}).value)||null;
  var sk=(document.getElementById("fSt")||{value:""}).value;
  var filtered=tools.filter(function(t){
    return t.name.toLowerCase().indexOf(q)>=0&&(!ag||t.agencyId===ag)&&(!cat||t.catId===cat)&&(!st||t.statusId===st)&&(!sk||stockOf(t)===sk);
  });
  document.getElementById("invList").innerHTML=filtered.length?filtered.map(toolCardHtml).join(""):"<div class='empty'><div class='empty-icon'>\u{1F50D}</div><div class='empty-text'>Sin resultados</div></div>";
}

/* ── STATUSES ────────────────────────────── */
function renderStatuses(){
  document.getElementById("statusList").innerHTML=statuses.map(function(s){
    var count=tools.filter(function(t){return t.statusId===s.id;}).length;
    return "<div class='st-row'>"+
      "<div class='st-dot' style='background:"+s.color+"'></div>"+
      "<div class='st-info'><div class='st-name'>"+esc(s.name)+"</div><div class='st-count'>"+count+" herramienta"+(count!==1?"s":"")+"</div></div>"+
      "<div class='st-badge-wrap'>"+statusBadge(s.id)+"</div>"+
      "<div class='ag-actions'>"+
        "<button class='btn-icon-sm' onclick='openStatusModal("+s.id+")'>\u270F\uFE0F</button>"+
        "<button class='btn-icon-sm red' onclick='deleteStatus("+s.id+")'>\u{1F5D1}</button>"+
      "</div></div>";
  }).join("")||"<div class='empty'><div class='empty-icon'>\u{1F3F7}</div><div class='empty-text'>Sin estatus</div></div>";
}
function openStatusModal(id){
  editingStatusId=id||null;
  var s=id?stById(id):null;
  document.getElementById("stModalTitle").textContent=s?"Editar estatus":"Nuevo estatus";
  document.getElementById("st-name").value=s?s.name:"";
  var cur=s?s.color:COLOR_PRESETS[0];
  document.getElementById("st-color").value=cur;
  var grid=document.getElementById("colorGrid");grid.innerHTML="";
  COLOR_PRESETS.forEach(function(c){
    var div=document.createElement("div");div.className="color-chip"+(c===cur?" selected":"");
    div.style.background=c;
    div.onclick=function(){document.getElementById("st-color").value=c;document.querySelectorAll(".color-chip").forEach(function(x){x.classList.remove("selected");});div.classList.add("selected");};
    grid.appendChild(div);
  });
  openModal("statusModal");
}
function saveStatus(){
  var name=document.getElementById("st-name").value.trim();
  if(!name){alert("Ingresa un nombre");return;}
  var color=document.getElementById("st-color").value||COLOR_PRESETS[0];
  var row={name:name,color:color};
  if(editingStatusId){
    row.id=editingStatusId;
    var existSt=stById(editingStatusId);
    var rowSt=Object.assign({},existSt,row,{id:editingStatusId});
    apiPost("update","statuses",rowSt,function(e){
      if(e){alert("Error: "+e);return;}
      if(existSt){existSt.name=name;existSt.color=color;}
      closeModal("statusModal");renderAll();
    });
  }else{
    apiPost("insert","statuses",row,function(e,d){
      if(e){alert("Error: "+e);return;}
      row.id=nextStatusId++;statuses.push(row);
      closeModal("statusModal");renderAll();
    });
  }
}
function deleteStatus(id){
  var s=stById(id);if(!s)return;
  var count=tools.filter(function(t){return t.statusId===id;}).length;
  if(!confirm(count>0?"Eliminar \""+s.name+"\"?\nTiene "+count+" herramienta(s) asignada(s).":"Eliminar \""+s.name+"\"?"))return;
  apiPost("delete","statuses",{id:id},function(e){
    if(e){alert("Error: "+e);return;}
    statuses.splice(statuses.findIndex(function(x){return x.id===id;}),1);
    tools.forEach(function(t){if(t.statusId===id)t.statusId=null;});
    renderAll();
  });
}

/* ── CATEGORIES ──────────────────────────── */
function renderCategories(){
  document.getElementById("catList").innerHTML=categories.map(function(c){
    var count=tools.filter(function(t){return t.catId===c.id;}).length;
    return "<div class='cat-row'>"+
      "<div class='cat-icon-box'>"+c.icon+"</div>"+
      "<div class='cat-info'><div class='cat-name'>"+esc(c.name)+"</div><div class='cat-count'>"+count+" herramienta"+(count!==1?"s":"")+"</div></div>"+
      "<div class='cat-actions'>"+
        "<button class='btn-icon-sm' onclick='openCatModal("+c.id+")'>\u270F\uFE0F</button>"+
        "<button class='btn-icon-sm red' onclick='deleteCat("+c.id+")'>\u{1F5D1}</button>"+
      "</div></div>";
  }).join("")||"<div class='empty'><div class='empty-icon'>\u{1F3F7}</div><div class='empty-text'>Sin categorias</div></div>";
}
function openCatModal(id){
  editingCatId=id||null;
  var c=id?catById(id):null;
  document.getElementById("catModalTitle").textContent=c?"Editar categoria":"Nueva categoria";
  document.getElementById("cat-name").value=c?c.name:"";
  selectedCatIcon=c?c.icon:"\u{1F527}";
  var grid=document.getElementById("catIconGrid");grid.innerHTML="";
  CAT_ICONS.forEach(function(ic){
    var div=document.createElement("div");div.className="chip"+(ic===selectedCatIcon?" selected":"");
    div.textContent=ic;div.onclick=function(){selectedCatIcon=ic;document.querySelectorAll("#catIconGrid .chip").forEach(function(x){x.classList.remove("selected");});div.classList.add("selected");};
    grid.appendChild(div);
  });
  openModal("catModal");
}
function saveCat(){
  var name=document.getElementById("cat-name").value.trim();
  if(!name){alert("Ingresa un nombre");return;}
  var row={name:name,icon:selectedCatIcon};
  if(editingCatId){
    row.id=editingCatId;
    var existCat=catById(editingCatId);
    var rowCat=Object.assign({},existCat,row,{id:editingCatId});
    apiPost("update","categories",rowCat,function(e){
      if(e){alert("Error: "+e);return;}
      if(existCat){existCat.name=name;existCat.icon=selectedCatIcon;}
      closeModal("catModal");renderAll();
    });
  }else{
    apiPost("insert","categories",row,function(e){
      if(e){alert("Error: "+e);return;}
      row.id=nextCatId++;categories.push(row);
      closeModal("catModal");renderAll();
    });
  }
}
function deleteCat(id){
  var c=catById(id);if(!c)return;
  var count=tools.filter(function(t){return t.catId===id;}).length;
  if(!confirm(count>0?"Eliminar \""+c.name+"\"?\nTiene "+count+" herramienta(s).":"Eliminar \""+c.name+"\"?"))return;
  apiPost("delete","categories",{id:id},function(e){
    if(e){alert("Error: "+e);return;}
    categories.splice(categories.findIndex(function(x){return x.id===id;}),1);
    tools.forEach(function(t){if(t.catId===id)t.catId=null;});
    renderAll();
  });
}

/* ── AGENCIES ────────────────────────────── */
function renderAgencies(){
  var q=(document.getElementById("searchAg")||{value:""}).value.toLowerCase();
  var filtered=agencies.filter(function(a){return a.name.toLowerCase().indexOf(q)>=0||(a.resp||"").toLowerCase().indexOf(q)>=0;});
  if(!filtered.length){document.getElementById("agList").innerHTML="<div class='empty'><div class='empty-icon'>\u{1F3EA}</div><div class='empty-text'>Sin agencias</div></div>";return;}
  document.getElementById("agList").innerHTML=filtered.map(function(ag){
    var agT=tools.filter(function(t){return t.agencyId===ag.id;});
    var total=agT.reduce(function(a,t){return a+t.total;},0);
    var avail=agT.reduce(function(a,t){return a+(t.total-t.used);},0);
    var outC=agT.filter(function(t){return stockOf(t)==="out";}).length;
    var warnC=agT.filter(function(t){return stockOf(t)==="low";}).length;
    var sb=outC>0?"<span class='badge badge-danger'>"+outC+" sin stock</span>":warnC>0?"<span class='badge badge-warn'>"+warnC+" bajo</span>":"<span class='badge badge-ok'>OK</span>";
    var ini=initials(ag.name.replace(/^Agencia /,""));
    return "<div class='ag-row'>"+
      "<div class='ag-avatar'>"+ini+"</div>"+
      "<div class='ag-info' onclick='openAgencyDetail("+ag.id+")'>"+
        "<div class='ag-name'>"+esc(ag.name)+"</div>"+
        "<div class='ag-resp-line'>"+(ag.resp?"\u{1F464} "+esc(ag.resp):"<span style='color:var(--text3)'>Sin responsable</span>")+"</div>"+
        "<div class='ag-stats-line'>"+agT.length+" tipos &middot; "+total+" uds &middot; "+avail+" disp. &nbsp;"+sb+"</div>"+
      "</div>"+
      "<div class='ag-actions'>"+
        "<button class='btn-icon-sm' onclick='openAgencyModal("+ag.id+")'>\u270F\uFE0F</button>"+
        "<button class='btn-icon-sm red' onclick='deleteAgency("+ag.id+")'>\u{1F5D1}</button>"+
      "</div></div>";
  }).join("");
}
function openAgencyDetail(id){
  var ag=agById(id);if(!ag)return;
  var agT=tools.filter(function(t){return t.agencyId===id;});
  var total=agT.reduce(function(a,t){return a+t.total;},0);
  var avail=agT.reduce(function(a,t){return a+(t.total-t.used);},0);
  var alertC=agT.filter(function(t){return stockOf(t)!=="ok";}).length;
  var ini=initials(ag.name.replace(/^Agencia /,""));
  var hasContact=ag.resp||ag.phone||ag.email||ag.addr;
  var contactHtml=hasContact?"<div class='contact-box'>"+(ag.resp?"<div class='contact-line'>\u{1F464} <strong>"+esc(ag.resp)+"</strong></div>":"")+(ag.phone?"<div class='contact-line'>\u{1F4DE} "+esc(ag.phone)+"</div>":"")+(ag.email?"<div class='contact-line'>\u2709 "+esc(ag.email)+"</div>":"")+(ag.notes?"<div class='contact-line' style='color:var(--text3)'>"+esc(ag.notes)+"</div>":"")+"</div>":"<div style='color:var(--text3);font-size:13px;margin-bottom:16px'>Sin informacion de contacto.</div>";
  var div=document.getElementById("agencyDetailContent");
  div.innerHTML="<div style='display:flex;align-items:center;gap:14px;margin-bottom:18px'>"+
    "<div style='width:52px;height:52px;border-radius:50%;background:var(--dalton);flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:19px;font-weight:700;color:#fff;font-family:var(--mono)'>"+ini+"</div>"+
    "<div><div style='font-size:19px;font-weight:600'>"+esc(ag.name)+"</div>"+(ag.addr?"<div style='font-size:12px;color:var(--text2);margin-top:3px'>\u{1F4CD} "+esc(ag.addr)+"</div>":"")+"</div></div>"+
    "<div class='stat-row'>"+
    "<div class='stat-box'><div class='stat-val'>"+total+"</div><div class='stat-lbl'>Total uds</div></div>"+
    "<div class='stat-box'><div class='stat-val' style='color:var(--green)'>"+avail+"</div><div class='stat-lbl'>Disponibles</div></div>"+
    "<div class='stat-box'><div class='stat-val' style='color:"+(alertC>0?"var(--dalton)":"var(--green)")+"'>"+alertC+"</div><div class='stat-lbl'>Alertas</div></div>"+
    "</div>"+contactHtml+
    "<div class='detail-actions'>"+
    "<button class='btn btn-sm' id='da-inv'>Ver inventario</button>"+
    "<button class='btn btn-sm' id='da-edit'>Editar</button>"+
    "</div>";
  document.getElementById("da-inv").onclick=function(){closeModal("agencyDetailModal");filterByAgency(id);};
  document.getElementById("da-edit").onclick=function(){closeModal("agencyDetailModal");openAgencyModal(id);};
  openModal("agencyDetailModal");
}
function openAgencyModal(id){
  editingAgencyId=id||null;var ag=id?agById(id):null;
  document.getElementById("agModalTitle").textContent=ag?"Editar agencia":"Nueva agencia";
  document.getElementById("ag-name").value=ag?ag.name:"";
  document.getElementById("ag-resp").value=ag?(ag.resp||""):"";
  document.getElementById("ag-phone").value=ag?(ag.phone||""):"";
  document.getElementById("ag-email").value=ag?(ag.email||""):"";
  document.getElementById("ag-addr").value=ag?(ag.addr||""):"";
  document.getElementById("ag-notes").value=ag?(ag.notes||""):"";
  openModal("agencyModal");
}
function saveAgency(){
  var name=document.getElementById("ag-name").value.trim();if(!name){alert("Ingresa un nombre");return;}
  var fields={name:name,resp:document.getElementById("ag-resp").value.trim(),phone:document.getElementById("ag-phone").value.trim(),email:document.getElementById("ag-email").value.trim(),addr:document.getElementById("ag-addr").value.trim(),notes:document.getElementById("ag-notes").value.trim()};
  if(editingAgencyId){
    var ag=agById(editingAgencyId);
    var row=Object.assign({},ag,fields,{id:editingAgencyId});
    apiPost("update","agencies",row,function(e){
      if(e){alert("Error: "+e);return;}
      Object.assign(ag,fields);
      closeModal("agencyModal");renderAll();
    });
  }else{
    apiPost("insert","agencies",fields,function(e){
      if(e){alert("Error: "+e);return;}
      fields.id=nextAgencyId++;agencies.push(fields);
      closeModal("agencyModal");renderAll();
    });
  }
}
function deleteAgency(id){
  var ag=agById(id);if(!ag)return;
  var count=tools.filter(function(t){return t.agencyId===id;}).length;
  if(!confirm(count>0?"Eliminar \""+ag.name+"\"?\nTiene "+count+" herramienta(s).":"Eliminar \""+ag.name+"\"?"))return;
  apiPost("delete","agencies",{id:id},function(e){
    if(e){alert("Error: "+e);return;}
    agencies.splice(agencies.findIndex(function(a){return a.id===id;}),1);
    renderAll();
  });
}
function filterByAgency(agId){showPage("inventory");var sel=document.getElementById("fAgency");if(sel){sel.value=agId;renderInventory();}}

/* ── SELECTS ─────────────────────────────── */
function populateSelects(){
  ["a-ag","m-ag","m-dest","fAgency"].forEach(function(id){
    var sel=document.getElementById(id);if(!sel)return;
    var hasAll=id==="fAgency";
    sel.innerHTML=(hasAll?"<option value=''>Todas las agencias</option>":"")+agencies.map(function(a){return "<option value='"+a.id+"'>"+esc(a.name)+"</option>";}).join("");
  });
  ["a-cat","fCat"].forEach(function(id){
    var sel=document.getElementById(id);if(!sel)return;
    var hasAll=id==="fCat";
    sel.innerHTML=(hasAll?"<option value=''>Categorias</option>":"")+categories.map(function(c){return "<option value='"+c.id+"'>"+c.icon+" "+esc(c.name)+"</option>";}).join("");
  });
  ["a-status","fStatus"].forEach(function(id){
    var sel=document.getElementById(id);if(!sel)return;
    var hasAll=id==="fStatus";
    sel.innerHTML=(hasAll?"<option value=''>Todos los estatus</option>":"")+statuses.map(function(s){return "<option value='"+s.id+"'>"+esc(s.name)+"</option>";}).join("");
  });
}

/* ── TOOL CRUD ───────────────────────────── */
function openAddModal(){
  document.getElementById("a-name").value="";
  document.getElementById("a-qty").value=1;
  document.getElementById("a-min").value=1;
  document.getElementById("a-code").value="";
  openModal("addModal");
}
function addTool(){
  var name=document.getElementById("a-name").value.trim();if(!name){alert("Ingresa un nombre");return;}
  var row={
    name:name,
    catId:parseInt(document.getElementById("a-cat").value)||0,
    agencyId:parseInt(document.getElementById("a-ag").value)||0,
    statusId:parseInt(document.getElementById("a-status").value)||0,
    total:document.getElementById("a-qty").value.trim()||"0",
    used:0,
    min:document.getElementById("a-min").value.trim()||"1",
    code:document.getElementById("a-code").value
  };
  apiPost("insert","tools",row,function(e){
    if(e){alert("Error: "+e);return;}
    row.id=nextToolId++;row.catId=Number(row.catId);row.agencyId=Number(row.agencyId);
    row.statusId=Number(row.statusId);row.total=Number(row.total);row.used=0;row.min=Number(row.min);
    tools.push(row);closeModal("addModal");renderAll();
  });
}
function openDetail(idx){
  var t=tools[idx];
  var availNum=parseQty(t.total)-parseQty(t.used);
  var dAvail=availNum%1===0?availNum:availNum.toFixed(2);
  var s=stockOf(t);
  var qc=s==="out"?"var(--dalton)":s==="low"?"var(--amber)":"var(--green)";
  var div=document.getElementById("detailContent");
  div.innerHTML=
    "<div style='display:flex;align-items:center;gap:14px;margin-bottom:20px'>"+
    "<div style='width:52px;height:52px;border-radius:14px;background:var(--dalton2);border:1px solid var(--dalton3);display:flex;align-items:center;justify-content:center;font-size:26px;flex-shrink:0'>"+catIcon(t.catId)+"</div>"+
    "<div><div style='font-size:20px;font-weight:600'>"+esc(t.name)+"</div>"+
    "<div style='font-size:13px;color:var(--text2);margin-top:2px'>"+esc(agName(t.agencyId))+" &middot; "+esc(catName(t.catId))+"</div>"+
    (t.code?"<div style='font-size:12px;color:var(--text3);font-family:var(--mono)'>"+esc(t.code)+"</div>":"")+"</div></div>"+

    "<div class='stat-row'>"+
    "<div class='stat-box'><div class='stat-val'>"+t.total+"</div><div class='stat-lbl'>Total</div></div>"+
    "<div class='stat-box'><div class='stat-val' style='color:"+qc+"'>"+dAvail+"</div><div class='stat-lbl'>Disponibles</div></div>"+
    "<div class='stat-box'><div class='stat-val'>"+t.used+"</div><div class='stat-lbl'>En uso</div></div>"+
    "</div>"+
    "<div style='margin-bottom:16px;display:flex;gap:6px;flex-wrap:wrap'>"+stockBadge(s)+statusBadge(t.statusId)+"</div>"+

    "<!-- AJUSTAR CANTIDAD -->"+
    "<div style='background:var(--bg2);border:1px solid var(--border);border-radius:10px;padding:14px;margin-bottom:14px'>"+
      "<div class='form-label' style='margin-bottom:10px'>Ajustar inventario</div>"+
      "<div style='display:flex;align-items:center;gap:10px;margin-bottom:10px'>"+
        "<button class='qty-btn' id='dd-minus'>&#8722;</button>"+
        "<input type='text' id='dd-qty-val' value='1' placeholder='Ej: 1/2' style='width:90px;text-align:center;font-size:15px;font-weight:600;padding:6px;border:1px solid var(--border);border-radius:8px;background:var(--bg);color:var(--text);font-family:var(--mono)'>"+
        "<button class='qty-btn' id='dd-plus'>&#43;</button>"+
        "<span style='font-size:12px;color:var(--text2)'>unidades</span>"+
      "</div>"+
      "<div style='display:flex;gap:8px'>"+
        "<button class='btn btn-sm btn-accent' id='dd-add' style='flex:1;justify-content:center'>&#43; Agregar al stock</button>"+
        "<button class='btn btn-sm btn-danger' id='dd-remove' style='flex:1;justify-content:center'>&#8722; Quitar del stock</button>"+
      "</div>"+
    "</div>"+

    "<!-- CAMBIAR AGENCIA, CATEGORIA, ESTATUS -->"+
    "<div style='background:var(--bg2);border:1px solid var(--border);border-radius:10px;padding:14px;margin-bottom:14px'>"+
      "<div class='form-label' style='margin-bottom:10px'>Modificar datos</div>"+
      "<div class='form-group' style='margin-bottom:10px'>"+
        "<label class='form-label' style='font-size:10px'>Agencia</label>"+
        "<select class='form-input' id='detail-ag-sel'>"+
          agencies.map(function(a){return "<option value='"+a.id+"'"+(t.agencyId===a.id?" selected":"")+">"+esc(a.name)+"</option>";}).join("")+
        "</select>"+
      "</div>"+
      "<div class='form-group' style='margin-bottom:10px'>"+
        "<label class='form-label' style='font-size:10px'>Categoria</label>"+
        "<select class='form-input' id='detail-cat-sel'>"+
          categories.map(function(c){return "<option value='"+c.id+"'"+(t.catId===c.id?" selected":"")+">"+c.icon+" "+esc(c.name)+"</option>";}).join("")+
        "</select>"+
      "</div>"+
      "<div class='form-group' style='margin-bottom:10px'>"+
        "<label class='form-label' style='font-size:10px'>Estatus</label>"+
        "<select class='form-input' id='detail-status-sel'>"+
          statuses.map(function(st){return "<option value='"+st.id+"'"+(t.statusId===st.id?" selected":"")+">"+esc(st.name)+"</option>";}).join("")+
        "</select>"+
      "</div>"+
      "<button class='btn btn-accent' id='dd-save' style='width:100%;justify-content:center'>Guardar cambios</button>"+
    "</div>"+

    "<button class='btn btn-danger' id='dd-del' style='width:100%;justify-content:center'>Eliminar herramienta</button>";

  /* qty controls */
  document.getElementById("dd-minus").onclick=function(){var el=document.getElementById("dd-qty-val");var v=parseQty(el.value||"1");el.value=Math.max(0.5,Math.round((v-0.5)*100)/100);};
  document.getElementById("dd-plus").onclick=function(){var el=document.getElementById("dd-qty-val");var v=parseQty(el.value||"0");el.value=Math.round((v+0.5)*100)/100;};

  /* agregar stock */
  document.getElementById("dd-add").onclick=function(){
    var qty=parseQty(document.getElementById("dd-qty-val").value)||0.5;
    var newTotal=Math.round((parseQty(t.total)+qty)*100)/100;
    var row=Object.assign({},t);row.total=newTotal;
    apiPost("update","tools",row,function(e){
      if(e){alert("Error: "+e);return;}
      t.total=newTotal;closeModal("detailModal");renderAll();
    });
  };

  /* quitar stock */
  document.getElementById("dd-remove").onclick=function(){
    var qty=parseQty(document.getElementById("dd-qty-val").value)||0.5;
    if(qty>parseQty(t.total)){alert("No puedes quitar mas de "+t.total+" unidades");return;}
    var curTotal=parseQty(t.total);var curUsed=parseQty(t.used);
    var newTotal=Math.round((curTotal-qty)*100)/100;
    var newUsed=Math.max(0,Math.round((curUsed-(Math.max(0,qty-(curTotal-curUsed))))*100)/100);
    var row=Object.assign({},t);row.total=newTotal;row.used=newUsed;
    apiPost("update","tools",row,function(e){
      if(e){alert("Error: "+e);return;}
      t.total=newTotal;t.used=newUsed;closeModal("detailModal");renderAll();
    });
  };

  /* guardar agencia / categoria / estatus */
  document.getElementById("dd-save").onclick=function(){
    var newAg=parseInt(document.getElementById("detail-ag-sel").value);
    var newCat=parseInt(document.getElementById("detail-cat-sel").value);
    var newSt=parseInt(document.getElementById("detail-status-sel").value);
    var row=Object.assign({},t);row.agencyId=newAg;row.catId=newCat;row.statusId=newSt;
    apiPost("update","tools",row,function(e){
      if(e){alert("Error: "+e);return;}
      t.agencyId=newAg;t.catId=newCat;t.statusId=newSt;
      closeModal("detailModal");renderAll();
    });
  };

  document.getElementById("dd-del").onclick=function(){deleteTool(idx);};
  openModal("detailModal");
}
function deleteTool(idx){
  if(!confirm("Eliminar esta herramienta?"))return;
  var t=tools[idx];
  apiPost("delete","tools",{id:t.id},function(e){
    if(e){alert("Error: "+e);return;}
    tools.splice(idx,1);closeModal("detailModal");renderAll();
  });
}

/* ── PAGES ───────────────────────────────── */
function showPage(id){
  document.querySelectorAll(".page").forEach(function(p){p.classList.remove("active");});
  document.querySelectorAll(".nav-item").forEach(function(n){n.classList.remove("active");});
  document.querySelectorAll(".desktop-nav button").forEach(function(b){b.classList.remove("active");});
  document.getElementById("page-"+id).classList.add("active");
  var ni=document.getElementById("nav-"+id);if(ni)ni.classList.add("active");
  var order={dashboard:0,inventory:1,agencies:2,categories:3,statuses:4};
  var dnBtns=document.querySelectorAll(".desktop-nav button");
  if(dnBtns[order[id]])dnBtns[order[id]].classList.add("active");
  if(id==="inventory")  renderInventory();
  if(id==="agencies")   renderAgencies();
  if(id==="categories") renderCategories();
  if(id==="statuses")   renderStatuses();
  window.scrollTo(0,0);
}
function openModal(id){document.getElementById(id).classList.add("open");}
function closeModal(id){document.getElementById(id).classList.remove("open");}
function openFAB(){openModal("fabModal");}
document.querySelectorAll(".modal-overlay").forEach(function(el){
  el.addEventListener("click",function(e){if(e.target===el)el.classList.remove("open");});
});

function renderAll(){
  populateSelects();renderKPIs();renderDashboard();renderInventory();
  renderAgencies();renderCategories();renderStatuses();
}

/* ── INIT ────────────────────────────────── */
loadAll(function(err){
  if(err){
    document.getElementById("globalLoader").innerHTML="<div style='color:#CC0000;font-size:14px;text-align:center;padding:2rem'>Error al conectar con Google Sheets.<br>Verifica que el script este publicado correctamente.</div>";
    document.getElementById("globalLoader").style.display="flex";
    return;
  }
  renderAll();
});
</script>
